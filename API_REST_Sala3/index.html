<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula API Lab - Gestion de Productos y Pedidos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <header class="mb-4 pb-3 border-bottom">
            <h1 class="h3 fw-bold text-primary">AULA API LAB - Cliente Web</h1>
            <p class="text-muted">Integración REST con autenticación por API Key</p>
        </header>

        <!-- Configuracion de API Key -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">Configuracion</h5>
                <div class="mb-3">
                    <label for="apiKey" class="form-label">Tu API Key personal:</label>
                    <input type="text" class="form-control" id="apiKey" placeholder="Pega aquí tu API Key obtenida en la plataforma">
                </div>
                <button class="btn btn-secondary btn-sm" onclick="saveApiKey()">Guardar API Key</button>
            </div>
        </div>

        <div class="row">
            <!-- Seccion de Productos -->
            <div class="col-lg-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title m-0">Productos Disponibles</h5>
                            <button class="btn btn-outline-primary btn-sm" onclick="loadProducts()">Actualizar</button>
                        </div>
                        <div id="products-container" class="list-group">
                            <!-- Los productos se cargarán aquí -->
                            <p class="text-muted">Ingresa tu API Key y haz clic en Actualizar.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sección de Pedidos -->
            <div class="col-lg-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Crear Nuevo Pedido</h5>
                        <form id="order-form" onsubmit="handleCreateOrder(event)">
                            <div class="mb-3">
                                <label for="productId" class="form-label">ID del Producto</label>
                                <input type="number" class="form-control" id="productId" required>
                            </div>
                            <div class="mb-3">
                                <label for="quantity" class="form-label">Cantidad</label>
                                <input type="number" class="form-control" id="quantity" value="1" min="1" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Enviar Pedido</button>
                        </form>

                        <hr class="my-4">

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="m-0">Pedidos Registrados</h6>
                            <button class="btn btn-outline-secondary btn-sm" onclick="loadOrders()">Ver Pedidos</button>
                        </div>
                        <div id="orders-container" style="max-height: 200px; overflow-y: auto;">
                            <!-- Los pedidos se cargarán aquí -->
                            <p class="text-muted small">Sin pedidos cargados.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Archivo JavaScript -->
    <script src="app.js"></script>
</body>
</html>

<div class="mb-3">
    <label for="customerName" class="form-label">Nombre del Cliente</label>
    <input type="text" class="form-control" id="customerName" placeholder="Tu nombre (2 a 100 caracteres)" required>
</div>
